<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">State diagram for a divisible-by-five checker, MSB first</title><desc id="d">Five states S0 to S4, each holding the remainder of the number received so far modulo five. On each incoming bit b the machine moves to state (2r + b) mod 5. Amber arcs above are taken on a one bit, green arcs below on a zero bit. S0 is drawn with a double ring because a remainder of zero means the number is divisible by five.</desc><style>
  .bg{fill:#07111f}
  .title{font:700 30px system-ui,sans-serif;fill:#f5f8fc}.label{font:600 20px system-ui,sans-serif;fill:#f5f8fc}
  .small{font:17px system-ui,sans-serif;fill:#a8b7c8}.tiny{font:14px system-ui,sans-serif;fill:#a8b7c8}
  .node{fill:#16283c;stroke:#3b556f;stroke-width:2}
  .code{font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f5f8fc}
  .one{fill:none;stroke:#ffb454;stroke-width:2.5}.zero{fill:none;stroke:#65e3a5;stroke-width:2.5}
  .lb1{font:600 16px system-ui,sans-serif;fill:#ffb454}.lb0{font:600 16px system-ui,sans-serif;fill:#65e3a5}
</style><defs>
<marker id="mOne" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#ffb454"/></marker>
<marker id="mZero" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#65e3a5"/></marker>
</defs>
<rect width="1000" height="620" class="bg"/>
<text x="50" y="48" class="title">Divisible by 5, MSB first</text>

<rect x="285" y="72" width="430" height="48" rx="14" fill="#0c2130" stroke="#29405a" stroke-width="2"/>
<text x="500" y="103" text-anchor="middle" class="code">r_next = (2*r + b) % 5</text>

<path d="M150 302 Q240 222 330 302" class="one" marker-end="url(#mOne)"/><text x="240" y="256" text-anchor="middle" class="lb1">1</text>
<path d="M330 302 Q510 132 690 302" class="one" marker-end="url(#mOne)"/><text x="510" y="211" text-anchor="middle" class="lb1">1</text>
<path d="M510 302 Q330 42 150 302" class="one" marker-end="url(#mOne)"/><text x="330" y="166" text-anchor="middle" class="lb1">1</text>
<path d="M690 302 Q600 222 510 302" class="one" marker-end="url(#mOne)"/><text x="600" y="256" text-anchor="middle" class="lb1">1</text>
<path d="M852 298 C824 232 916 232 888 298" class="one" marker-end="url(#mOne)"/><text x="870" y="238" text-anchor="middle" class="lb1">1</text>

<path d="M330 378 Q420 458 510 378" class="zero" marker-end="url(#mZero)"/><text x="420" y="429" text-anchor="middle" class="lb0">0</text>
<path d="M510 378 Q690 548 870 378" class="zero" marker-end="url(#mZero)"/><text x="690" y="474" text-anchor="middle" class="lb0">0</text>
<path d="M690 378 Q510 638 330 378" class="zero" marker-end="url(#mZero)"/><text x="510" y="519" text-anchor="middle" class="lb0">0</text>
<path d="M870 378 Q780 458 690 378" class="zero" marker-end="url(#mZero)"/><text x="780" y="429" text-anchor="middle" class="lb0">0</text>
<path d="M132 374 C104 440 196 440 168 374" class="zero" marker-end="url(#mZero)"/><text x="150" y="452" text-anchor="middle" class="lb0">0</text>

<circle cx="150" cy="340" r="46" fill="none" stroke="#31d7e8" stroke-width="2.5"/>
<circle cx="150" cy="340" r="38" class="node"/><text x="150" y="348" text-anchor="middle" class="label">S0</text>
<circle cx="330" cy="340" r="38" class="node"/><text x="330" y="348" text-anchor="middle" class="label">S1</text>
<circle cx="510" cy="340" r="38" class="node"/><text x="510" y="348" text-anchor="middle" class="label">S2</text>
<circle cx="690" cy="340" r="38" class="node"/><text x="690" y="348" text-anchor="middle" class="label">S3</text>
<circle cx="870" cy="340" r="38" class="node"/><text x="870" y="348" text-anchor="middle" class="label">S4</text>

<path d="M90 555H120" class="zero"/><text x="130" y="561" class="small">bit = 0</text>
<path d="M270 555H300" class="one"/><text x="310" y="561" class="small">bit = 1</text>
<circle cx="470" cy="555" r="10" fill="none" stroke="#31d7e8" stroke-width="2"/><circle cx="470" cy="555" r="5" class="node"/><text x="488" y="561" class="small">double ring: r = 0, divisible</text>

<text x="500" y="600" text-anchor="middle" class="label">State is the remainder so far. Five remainders, so exactly five states.</text>
</svg>
