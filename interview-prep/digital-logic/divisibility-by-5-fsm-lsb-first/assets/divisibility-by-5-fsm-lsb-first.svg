<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Divisible by five with bits arriving LSB first</title><desc id="d">Two recurrences are needed. The remainder updates as r plus b times w, modulo five. The weight w is two to the power k modulo five, which cycles through one, two, four, three with period four. Because the weight must be carried alongside the remainder, the state is the pair r and w, giving five times four equals twenty states rather than five.</desc><style>
  .bg{fill:#07111f}.panel{fill:#0e1b2b;stroke:#29405a;stroke-width:2}
  .title{font:700 30px system-ui,sans-serif;fill:#f5f8fc}.label{font:600 20px system-ui,sans-serif;fill:#f5f8fc}
  .small{font:17px system-ui,sans-serif;fill:#a8b7c8}.tiny{font:14px system-ui,sans-serif;fill:#a8b7c8}
  .node{fill:#16283c;stroke:#3b556f;stroke-width:2}
  .code{font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f5f8fc}
  .wire{fill:none;stroke:#9fb0c4;stroke-width:2.5;stroke-linecap:round}
</style><defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#9fb0c4"/></marker>
</defs>
<rect width="1000" height="600" class="bg"/>
<text x="50" y="48" class="title">Divisible by 5, LSB first</text>

<rect x="50" y="76" width="430" height="48" rx="14" fill="#0c2130" stroke="#65e3a5" stroke-width="2"/>
<text x="265" y="106" text-anchor="middle" class="code">r_next = (r + b*w) % 5</text>
<rect x="520" y="76" width="430" height="48" rx="14" fill="#0c2130" stroke="#31d7e8" stroke-width="2"/>
<text x="735" y="106" text-anchor="middle" class="code">w_next = (2*w) % 5</text>

<rect x="50" y="150" width="430" height="330" rx="26" class="panel"/>
<text x="85" y="186" class="label">Weight cycles, period 4</text>
<path d="M288 268L337 317" class="wire" marker-end="url(#a)"/>
<path d="M337 363L288 412" class="wire" marker-end="url(#a)"/>
<path d="M242 412L193 363" class="wire" marker-end="url(#a)"/>
<path d="M193 317L242 268" class="wire" marker-end="url(#a)"/>
<text x="265" y="336" text-anchor="middle" class="small">double it</text>
<text x="265" y="358" text-anchor="middle" class="tiny">mod 5</text>
<circle cx="265" cy="245" r="32" class="node"/><text x="265" y="253" text-anchor="middle" class="label">1</text>
<circle cx="360" cy="340" r="32" class="node"/><text x="360" y="348" text-anchor="middle" class="label">2</text>
<circle cx="265" cy="435" r="32" class="node"/><text x="265" y="443" text-anchor="middle" class="label">4</text>
<circle cx="170" cy="340" r="32" class="node"/><text x="170" y="348" text-anchor="middle" class="label">3</text>

<rect x="520" y="150" width="430" height="330" rx="26" class="panel"/>
<text x="555" y="186" class="label">State is the pair (r, w)</text>
<text x="555" y="212" class="tiny">columns: remainder r = 0 to 4    rows: weight w = 1, 2, 4, 3</text>
<text x="599" y="236" text-anchor="middle" class="tiny">0</text><text x="667" y="236" text-anchor="middle" class="tiny">1</text><text x="735" y="236" text-anchor="middle" class="tiny">2</text><text x="803" y="236" text-anchor="middle" class="tiny">3</text><text x="871" y="236" text-anchor="middle" class="tiny">4</text>
<text x="561" y="275" text-anchor="end" class="tiny">1</text><text x="561" y="333" text-anchor="end" class="tiny">2</text><text x="561" y="391" text-anchor="end" class="tiny">4</text><text x="561" y="449" text-anchor="end" class="tiny">3</text>
<rect x="569" y="244" width="60" height="50" rx="8" fill="#16283c" stroke="#31d7e8" stroke-width="2"/><rect x="637" y="244" width="60" height="50" rx="8" class="node"/><rect x="705" y="244" width="60" height="50" rx="8" class="node"/><rect x="773" y="244" width="60" height="50" rx="8" class="node"/><rect x="841" y="244" width="60" height="50" rx="8" class="node"/>
<rect x="569" y="302" width="60" height="50" rx="8" fill="#16283c" stroke="#31d7e8" stroke-width="2"/><rect x="637" y="302" width="60" height="50" rx="8" class="node"/><rect x="705" y="302" width="60" height="50" rx="8" class="node"/><rect x="773" y="302" width="60" height="50" rx="8" class="node"/><rect x="841" y="302" width="60" height="50" rx="8" class="node"/>
<rect x="569" y="360" width="60" height="50" rx="8" fill="#16283c" stroke="#31d7e8" stroke-width="2"/><rect x="637" y="360" width="60" height="50" rx="8" class="node"/><rect x="705" y="360" width="60" height="50" rx="8" class="node"/><rect x="773" y="360" width="60" height="50" rx="8" class="node"/><rect x="841" y="360" width="60" height="50" rx="8" class="node"/>
<rect x="569" y="418" width="60" height="50" rx="8" fill="#16283c" stroke="#31d7e8" stroke-width="2"/><rect x="637" y="418" width="60" height="50" rx="8" class="node"/><rect x="705" y="418" width="60" height="50" rx="8" class="node"/><rect x="773" y="418" width="60" height="50" rx="8" class="node"/><rect x="841" y="418" width="60" height="50" rx="8" class="node"/>

<text x="500" y="528" text-anchor="middle" class="label">The incoming bit's weight changes every cycle, so weight is extra state.</text>
<text x="500" y="562" text-anchor="middle" class="small">Twenty states instead of five. Cyan column is r = 0, the divisible case.</text>
</svg>
