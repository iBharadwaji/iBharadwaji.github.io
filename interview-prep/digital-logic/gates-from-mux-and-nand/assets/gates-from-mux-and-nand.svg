<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">A 2 to 1 mux as one Shannon expansion step, and XOR built from four NAND gates</title><desc id="d">Left: a 2 to 1 multiplexer computes Y equals not S and D0, or S and D1, which is exactly one step of Shannon expansion, so D0 is the function with A forced to zero and D1 is the function with A forced to one. Right: the minimal four NAND XOR. N1 is NAND of A and B, which by De Morgan equals A prime plus B prime and therefore carries both complements in a single signal. N2 is NAND of A and N1, N3 is NAND of B and N1, and N4 combines them.</desc><style>
  .bg{fill:#07111f}.panel{fill:#0e1b2b;stroke:#29405a;stroke-width:2}
  .title{font:700 30px system-ui,sans-serif;fill:#f5f8fc}.label{font:600 20px system-ui,sans-serif;fill:#f5f8fc}
  .small{font:17px system-ui,sans-serif;fill:#a8b7c8}.tiny{font:14px system-ui,sans-serif;fill:#a8b7c8}
  .node{fill:#16283c;stroke:#3b556f;stroke-width:2}
  .code{font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f5f8fc}
  .wire{fill:none;stroke:#9fb0c4;stroke-width:2.5;stroke-linecap:round}
  .gate{fill:#16283c;stroke:#31d7e8;stroke-width:2}
  .bub{fill:#0e1b2b;stroke:#31d7e8;stroke-width:2}
</style><defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#9fb0c4"/></marker>
</defs>
<rect width="1000" height="560" class="bg"/>
<text x="50" y="48" class="title">Functional completeness: mux and NAND</text>

<rect x="50" y="88" width="430" height="340" rx="26" class="panel"/>
<text x="85" y="124" class="label">One mux = one Shannon step</text>
<text x="85" y="154" class="code">Y = ~S &amp; D0 | S &amp; D1</text>
<text x="85" y="180" class="code">F = ~A &amp; F(0,B) | A &amp; F(1,B)</text>
<rect x="240" y="210" width="70" height="150" rx="8" class="node"/><text x="275" y="292" text-anchor="middle" class="label">2:1</text>
<path d="M140 245H240" class="wire"/><text x="134" y="251" text-anchor="end" class="small">D0</text>
<path d="M140 290H240" class="wire"/><text x="134" y="296" text-anchor="end" class="small">D1</text>
<path d="M140 335H240" class="wire"/><text x="134" y="341" text-anchor="end" class="small">S</text>
<path d="M310 290H400" class="wire" marker-end="url(#a)"/><text x="410" y="296" class="small">Y</text>
<text x="265" y="400" text-anchor="middle" class="tiny">D0 = F with A = 0        D1 = F with A = 1</text>

<rect x="520" y="88" width="430" height="340" rx="26" class="panel"/>
<text x="555" y="124" class="label">XOR from 4 NANDs</text>
<text x="555" y="150" class="tiny">N1 = (AB)' = A' + B', one signal carrying both complements</text>

<path d="M540 182H600" class="wire"/><text x="536" y="188" text-anchor="end" class="small">A</text>
<path d="M562 182V252H700" class="wire"/><circle cx="562" cy="182" r="3.5" fill="#9fb0c4"/>
<path d="M540 214H580" class="wire"/><text x="536" y="220" text-anchor="end" class="small">B</text>
<path d="M580 198V337" class="wire"/><path d="M580 198H600" class="wire"/><path d="M580 337H700" class="wire"/><circle cx="580" cy="214" r="3.5" fill="#9fb0c4"/>
<path d="M660 190H675V353" class="wire"/><path d="M675 268H700" class="wire"/><path d="M675 353H700" class="wire"/><circle cx="675" cy="268" r="3.5" fill="#9fb0c4"/>
<path d="M760 260H780V292H815" class="wire"/>
<path d="M760 345H790V308H815" class="wire"/>
<path d="M875 300H915" class="wire" marker-end="url(#a)"/><text x="924" y="306" class="small">Y</text>

<rect x="600" y="170" width="50" height="40" rx="6" class="gate"/><circle cx="655" cy="190" r="5" class="bub"/><text x="625" y="195" text-anchor="middle" class="tiny">N1</text><text x="668" y="180" class="tiny">A' + B'</text>
<rect x="700" y="240" width="50" height="40" rx="6" class="gate"/><circle cx="755" cy="260" r="5" class="bub"/><text x="725" y="265" text-anchor="middle" class="tiny">N2</text><text x="763" y="250" class="tiny">(A B')'</text>
<rect x="700" y="325" width="50" height="40" rx="6" class="gate"/><circle cx="755" cy="345" r="5" class="bub"/><text x="725" y="350" text-anchor="middle" class="tiny">N3</text><text x="763" y="335" class="tiny">(A' B)'</text>
<rect x="815" y="280" width="50" height="40" rx="6" class="gate"/><circle cx="870" cy="300" r="5" class="bub"/><text x="840" y="305" text-anchor="middle" class="tiny">N4</text>

<text x="500" y="482" text-anchor="middle" class="label">A mux plus tie-offs gives NOT and AND, so it is functionally complete.</text>
<text x="500" y="516" text-anchor="middle" class="small">NAND count: NOT 1, AND 2, OR 3, XOR 4. Four is minimal for XOR.</text>
</svg>
