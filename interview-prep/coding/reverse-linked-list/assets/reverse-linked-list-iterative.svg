<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="t d"><title id="t">Reversing a singly linked list, one iteration</title><desc id="d">Before the iteration, prev points at node A and curr at node B, and there is no link between them. Step one saves next as node C. Step two flips B to point back at A. Steps three and four advance prev to B and curr to C. Saving next must happen before the flip, because the flip overwrites the only pointer to the rest of the list.</desc><style>
  .bg{fill:#07111f}.panel{fill:#0e1b2b;stroke:#29405a;stroke-width:2}
  .title{font:700 30px system-ui,sans-serif;fill:#f5f8fc}.label{font:600 20px system-ui,sans-serif;fill:#f5f8fc}
  .small{font:17px system-ui,sans-serif;fill:#a8b7c8}.tiny{font:14px system-ui,sans-serif;fill:#a8b7c8}
  .node{fill:#16283c;stroke:#3b556f;stroke-width:2}
  .blob{fill:none;stroke:#3b556f;stroke-width:2;stroke-dasharray:6 5}
  .code{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f5f8fc}
  .wire{fill:none;stroke:#9fb0c4;stroke-width:3;stroke-linecap:round}
  .tag{fill:#0c2130;stroke-width:2}.tagtxt{font:600 15px system-ui,sans-serif}
  .badge{font:700 15px system-ui,sans-serif;fill:#07111f}
  .sev{font:14px system-ui,sans-serif;fill:#ff7184}
</style><defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#9fb0c4"/></marker>
<marker id="aAmber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#ffb454"/></marker>
</defs>
<rect width="1000" height="660" class="bg"/>
<text x="50" y="56" class="title">Reverse a linked list: one iteration</text>
<rect x="50" y="88" width="900" height="320" rx="26" class="panel"/>

<text x="85" y="208" class="small">Before</text>
<rect x="190" y="176" width="100" height="50" rx="10" class="blob"/><text x="240" y="207" text-anchor="middle" class="small">reversed</text>
<rect x="360" y="176" width="86" height="50" rx="10" class="node"/><text x="403" y="208" text-anchor="middle" class="label">A</text>
<rect x="516" y="176" width="86" height="50" rx="10" class="node"/><text x="559" y="208" text-anchor="middle" class="label">B</text>
<rect x="672" y="176" width="86" height="50" rx="10" class="node"/><text x="715" y="208" text-anchor="middle" class="label">C</text>
<rect x="828" y="176" width="100" height="50" rx="10" class="blob"/><text x="878" y="207" text-anchor="middle" class="small">rest</text>
<path d="M360 201H296" class="wire" marker-end="url(#a)"/>
<path d="M602 201H666" class="wire" marker-end="url(#a)"/>
<path d="M758 201H822" class="wire" marker-end="url(#a)"/>
<text x="481" y="249" text-anchor="middle" class="sev">no link</text>
<rect x="360" y="140" width="86" height="26" rx="13" class="tag" stroke="#31d7e8"/><text x="403" y="158" text-anchor="middle" class="tagtxt" fill="#31d7e8">prev</text><path d="M403 166V176" stroke="#31d7e8" stroke-width="2"/>
<rect x="516" y="140" width="86" height="26" rx="13" class="tag" stroke="#ffb454"/><text x="559" y="158" text-anchor="middle" class="tagtxt" fill="#ffb454">curr</text><path d="M559 166V176" stroke="#ffb454" stroke-width="2"/>
<rect x="672" y="140" width="86" height="26" rx="13" class="tag" stroke="#65e3a5" stroke-dasharray="5 4"/><text x="715" y="158" text-anchor="middle" class="tagtxt" fill="#65e3a5">next</text><path d="M715 166V176" stroke="#65e3a5" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="654" cy="153" r="12" fill="#65e3a5"/><text x="654" y="159" text-anchor="middle" class="badge">1</text>

<text x="85" y="358" class="small">After</text>
<rect x="190" y="326" width="100" height="50" rx="10" class="blob"/><text x="240" y="357" text-anchor="middle" class="small">reversed</text>
<rect x="360" y="326" width="86" height="50" rx="10" class="node"/><text x="403" y="358" text-anchor="middle" class="label">A</text>
<rect x="516" y="326" width="86" height="50" rx="10" class="node"/><text x="559" y="358" text-anchor="middle" class="label">B</text>
<rect x="672" y="326" width="86" height="50" rx="10" class="node"/><text x="715" y="358" text-anchor="middle" class="label">C</text>
<rect x="828" y="326" width="100" height="50" rx="10" class="blob"/><text x="878" y="357" text-anchor="middle" class="small">rest</text>
<path d="M360 351H296" class="wire" marker-end="url(#a)"/>
<path d="M516 351H452" fill="none" stroke="#ffb454" stroke-width="3" stroke-linecap="round" marker-end="url(#aAmber)"/>
<path d="M758 351H822" class="wire" marker-end="url(#a)"/>
<text x="637" y="399" text-anchor="middle" class="sev">no link</text>
<circle cx="484" cy="351" r="12" fill="#ffb454"/><text x="484" y="357" text-anchor="middle" class="badge">2</text>
<rect x="516" y="290" width="86" height="26" rx="13" class="tag" stroke="#31d7e8"/><text x="559" y="308" text-anchor="middle" class="tagtxt" fill="#31d7e8">prev</text><path d="M559 316V326" stroke="#31d7e8" stroke-width="2"/>
<rect x="672" y="290" width="86" height="26" rx="13" class="tag" stroke="#ffb454"/><text x="715" y="308" text-anchor="middle" class="tagtxt" fill="#ffb454">curr</text><path d="M715 316V326" stroke="#ffb454" stroke-width="2"/>
<circle cx="500" cy="303" r="12" fill="#31d7e8"/><text x="500" y="309" text-anchor="middle" class="badge">3</text>
<circle cx="656" cy="303" r="12" fill="#ffb454"/><text x="656" y="309" text-anchor="middle" class="badge">4</text>

<rect x="50" y="428" width="430" height="64" rx="14" fill="#0c2130" stroke="#65e3a5" stroke-width="2"/>
<circle cx="82" cy="460" r="14" fill="#65e3a5"/><text x="82" y="466" text-anchor="middle" class="badge">1</text>
<text x="112" y="455" class="code">next = curr-&gt;next</text><text x="112" y="478" class="tiny">save the rest of the list</text>

<rect x="520" y="428" width="430" height="64" rx="14" fill="#0c2130" stroke="#ffb454" stroke-width="2"/>
<circle cx="552" cy="460" r="14" fill="#ffb454"/><text x="552" y="466" text-anchor="middle" class="badge">2</text>
<text x="582" y="455" class="code">curr-&gt;next = prev</text><text x="582" y="478" class="tiny">flip this node's link backwards</text>

<rect x="50" y="504" width="430" height="64" rx="14" fill="#0c2130" stroke="#31d7e8" stroke-width="2"/>
<circle cx="82" cy="536" r="14" fill="#31d7e8"/><text x="82" y="542" text-anchor="middle" class="badge">3</text>
<text x="112" y="531" class="code">prev = curr</text><text x="112" y="554" class="tiny">advance prev one node</text>

<rect x="520" y="504" width="430" height="64" rx="14" fill="#0c2130" stroke="#ffb454" stroke-width="2"/>
<circle cx="552" cy="536" r="14" fill="#ffb454"/><text x="552" y="542" text-anchor="middle" class="badge">4</text>
<text x="582" y="531" class="code">curr = next</text><text x="582" y="554" class="tiny">advance curr one node</text>

<text x="500" y="604" text-anchor="middle" class="label">Step 1 must precede step 2: the flip destroys the only pointer to the rest.</text>
<text x="500" y="634" text-anchor="middle" class="small">Loop ends when curr is null. Return prev, not curr.</text>
</svg>
