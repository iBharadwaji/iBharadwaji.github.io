<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Speculative cache footprint versus speculative buffer</title><desc id="d">A conventional wrong-path load leaves a cache line, while the intended Cuzco path discards a speculative buffer entry before changing the cache.</desc><style>
  .bg{fill:#07111f}.panel{fill:#0e1b2b;stroke:#29405a;stroke-width:2}
  .title{font:700 30px system-ui,sans-serif;fill:#f5f8fc}.label{font:600 20px system-ui,sans-serif;fill:#f5f8fc}
  .small{font:17px system-ui,sans-serif;fill:#a8b7c8}.tiny{font:14px system-ui,sans-serif;fill:#a8b7c8}
  .cyan{fill:#31d7e8}.amber{fill:#ffb454}.green{fill:#65e3a5}.red{fill:#ff7184}.purple{fill:#a78bfa}
  .wire{fill:none;stroke:#9fb0c4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#9fb0c4"/></marker><marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#31d7e8"/></marker></defs><rect width="1000" height="620" class="bg"/><text x="50" y="58" class="title">Contain speculative memory effects</text><rect x="50" y="95" width="420" height="440" rx="26" class="panel"/><text x="80" y="138" class="label red">Persistent cache footprint</text><rect x="115" y="175" width="290" height="55" rx="14" fill="#2c1b25" stroke="#ff7184" stroke-width="2"/><text x="260" y="210" text-anchor="middle" class="small">wrong-path LOAD X</text><path d="M260 240v45" class="wire" marker-end="url(#arrow)"/><rect x="115" y="300" width="290" height="100" rx="18" fill="#15283c" stroke="#ffb454" stroke-width="3"/><text x="260" y="340" text-anchor="middle" class="label">CACHE</text><rect x="165" y="360" width="190" height="25" rx="6" class="amber"/><text x="260" y="450" text-anchor="middle" class="small red">attacker later sees a fast hit</text><rect x="530" y="95" width="420" height="440" rx="26" fill="#0c2130" stroke="#31d7e8" stroke-width="3"/><text x="560" y="138" class="label cyan">Isolated speculative state</text><rect x="595" y="175" width="290" height="55" rx="14" fill="#102b3b" stroke="#31d7e8" stroke-width="2"/><text x="740" y="210" text-anchor="middle" class="small">wrong-path LOAD X</text><path d="M740 240v40" class="wire" marker-end="url(#arrow)"/><rect x="595" y="295" width="290" height="95" rx="18" fill="#1b1830" stroke="#a78bfa" stroke-width="3"/><text x="740" y="335" text-anchor="middle" class="label">SPEC BUFFER</text><text x="740" y="365" text-anchor="middle" class="tiny">temporary SRAM state</text><path d="M700 415l80 65M780 415l-80 65" class="wire" stroke="#ff7184"/><text x="740" y="510" text-anchor="middle" class="small green">squash → cache unchanged</text><rect x="90" y="555" width="820" height="42" rx="18" fill="#241d20" stroke="#ffb454" stroke-width="2"/><text x="500" y="582" text-anchor="middle" class="small">Boundary: the buffer's occupancy and contention must also be non-observable.</text></svg>