<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">VSET prediction</title><desc id="d">Ten vector elements are processed with vector lengths four four and two, while a VSET predictor allows vector operations to be sequenced early.</desc><style>
  .bg{fill:#07111f}.panel{fill:#0e1b2b;stroke:#29405a;stroke-width:2}
  .title{font:700 30px system-ui,sans-serif;fill:#f5f8fc}.label{font:600 20px system-ui,sans-serif;fill:#f5f8fc}
  .small{font:17px system-ui,sans-serif;fill:#a8b7c8}.tiny{font:14px system-ui,sans-serif;fill:#a8b7c8}
  .cyan{fill:#31d7e8}.amber{fill:#ffb454}.green{fill:#65e3a5}.red{fill:#ff7184}.purple{fill:#a78bfa}
  .wire{fill:none;stroke:#9fb0c4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#9fb0c4"/></marker><marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#31d7e8"/></marker></defs><rect width="1000" height="620" class="bg"/><text x="50" y="58" class="title">VSET prediction: remove a vector serialization point</text><text x="70" y="112" class="label">Ten elements, four at a time</text><g transform="translate(80 145)"><rect x="0" width="47" height="56" rx="9" fill="#31d7e8"/><text x="23" y="36" text-anchor="middle" class="small" fill="#07111f">0</text><rect x="55" width="47" height="56" rx="9" fill="#31d7e8"/><text x="78" y="36" text-anchor="middle" class="small" fill="#07111f">1</text><rect x="110" width="47" height="56" rx="9" fill="#31d7e8"/><text x="133" y="36" text-anchor="middle" class="small" fill="#07111f">2</text><rect x="165" width="47" height="56" rx="9" fill="#31d7e8"/><text x="188" y="36" text-anchor="middle" class="small" fill="#07111f">3</text><text x="108" y="88" text-anchor="middle" class="small">VL = 4</text></g><g transform="translate(370 145)"><rect x="0" width="47" height="56" rx="9" fill="#31d7e8"/><text x="23" y="36" text-anchor="middle" class="small" fill="#07111f">4</text><rect x="55" width="47" height="56" rx="9" fill="#31d7e8"/><text x="78" y="36" text-anchor="middle" class="small" fill="#07111f">5</text><rect x="110" width="47" height="56" rx="9" fill="#31d7e8"/><text x="133" y="36" text-anchor="middle" class="small" fill="#07111f">6</text><rect x="165" width="47" height="56" rx="9" fill="#31d7e8"/><text x="188" y="36" text-anchor="middle" class="small" fill="#07111f">7</text><text x="108" y="88" text-anchor="middle" class="small">VL = 4</text></g><g transform="translate(660 145)"><rect x="0" width="47" height="56" rx="9" fill="#ffb454"/><text x="23" y="36" text-anchor="middle" class="small" fill="#07111f">8</text><rect x="55" width="47" height="56" rx="9" fill="#ffb454"/><text x="78" y="36" text-anchor="middle" class="small" fill="#07111f">9</text><text x="54" y="88" text-anchor="middle" class="small">VL = 2</text></g><rect x="90" y="285" width="250" height="100" rx="22" fill="#1b1730" stroke="#a78bfa" stroke-width="3"/><text x="215" y="326" text-anchor="middle" class="label">VSET</text><text x="215" y="357" text-anchor="middle" class="small">produces VL + vtype</text><path d="M355 335H470" class="wire" marker-end="url(#cyanArrow)" stroke="#31d7e8"/><rect x="500" y="285" width="390" height="100" rx="22" fill="#0f2b3a" stroke="#31d7e8" stroke-width="3"/><text x="695" y="326" text-anchor="middle" class="label cyan">VSET predictor</text><text x="695" y="357" text-anchor="middle" class="small">guess configuration early</text><path d="M695 398v60" class="wire" marker-end="url(#arrow)"/><g transform="translate(80 475)"><rect width="190" height="80" rx="18" fill="#10263a" stroke="#31d7e8" stroke-width="2"/><text x="95" y="35" text-anchor="middle" class="label">Slice 0</text><text x="95" y="61" text-anchor="middle" class="tiny">vector chunk</text></g><g transform="translate(305 475)"><rect width="190" height="80" rx="18" fill="#10263a" stroke="#65e3a5" stroke-width="2"/><text x="95" y="35" text-anchor="middle" class="label">Slice 1</text><text x="95" y="61" text-anchor="middle" class="tiny">vector chunk</text></g><g transform="translate(530 475)"><rect width="190" height="80" rx="18" fill="#10263a" stroke="#ffb454" stroke-width="2"/><text x="95" y="35" text-anchor="middle" class="label">Slice 2</text><text x="95" y="61" text-anchor="middle" class="tiny">vector chunk</text></g><g transform="translate(755 475)"><rect width="190" height="80" rx="18" fill="#10263a" stroke="#a78bfa" stroke-width="2"/><text x="95" y="35" text-anchor="middle" class="label">Slice 3</text><text x="95" y="61" text-anchor="middle" class="tiny">vector chunk</text></g><text x="500" y="600" text-anchor="middle" class="small">Predict → sequence internal vector operations → validate or replay</text></svg>