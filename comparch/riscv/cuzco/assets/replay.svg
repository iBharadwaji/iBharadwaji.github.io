<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="t d"><title id="t">Load miss and replay</title><desc id="d">A predicted load result at cycle 30 is delayed; the consumer checks the scoreboard, scans the TRM again, and replays later.</desc><style>
  .bg{fill:#07111f}.panel{fill:#0e1b2b;stroke:#29405a;stroke-width:2}
  .title{font:700 30px system-ui,sans-serif;fill:#f5f8fc}.label{font:600 20px system-ui,sans-serif;fill:#f5f8fc}
  .small{font:17px system-ui,sans-serif;fill:#a8b7c8}.tiny{font:14px system-ui,sans-serif;fill:#a8b7c8}
  .cyan{fill:#31d7e8}.amber{fill:#ffb454}.green{fill:#65e3a5}.red{fill:#ff7184}.purple{fill:#a78bfa}
  .wire{fill:none;stroke:#9fb0c4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#9fb0c4"/></marker><marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#31d7e8"/></marker></defs><rect width="1000" height="570" class="bg"/><text x="50" y="58" class="title">When the prediction is wrong, repair the calendar</text><text x="70" y="112" class="label cyan">Predicted</text><path d="M170 130H900" class="wire" marker-end="url(#arrow)"/><g><circle cx="250" cy="130" r="36" fill="#5ca9ff"/><text x="250" y="137" text-anchor="middle" class="tiny" fill="#07111f">LOAD</text><text x="250" y="185" text-anchor="middle" class="tiny">t28</text></g><g><circle cx="500" cy="130" r="36" fill="#65e3a5"/><text x="500" y="137" text-anchor="middle" class="tiny" fill="#07111f">DATA</text><text x="500" y="185" text-anchor="middle" class="tiny">t30</text></g><g><circle cx="750" cy="130" r="36" fill="#31d7e8"/><text x="750" y="137" text-anchor="middle" class="tiny" fill="#07111f">ADD</text><text x="750" y="185" text-anchor="middle" class="tiny">t31</text></g><text x="70" y="252" class="label red">Actual: L1 miss</text><path d="M170 270H900" class="wire" marker-end="url(#arrow)"/><circle cx="250" cy="270" r="36" fill="#5ca9ff"/><text x="250" y="277" text-anchor="middle" class="tiny" fill="#07111f">LOAD</text><path d="M340 240l68 68M408 240l-68 68" class="wire" stroke="#ff7184"/><text x="374" y="335" text-anchor="middle" class="small red">not ready @ t30</text><circle cx="800" cy="270" r="42" class="green"/><text x="800" y="277" text-anchor="middle" class="label" fill="#07111f">t45</text><text x="800" y="335" text-anchor="middle" class="small">new appointment</text><g><rect x="70" y="405" width="220" height="72" rx="18" fill="#13263b" stroke="#31d7e8" stroke-width="2"/><text x="180" y="450" text-anchor="middle" class="label">Recheck RSB</text><path d="M300 441H345" class="wire" marker-end="url(#arrow)"/></g><g><rect x="360" y="405" width="250" height="72" rx="18" fill="#13263b" stroke="#ffb454" stroke-width="2"/><text x="485" y="450" text-anchor="middle" class="label">Scan TRM again</text><path d="M620 441H685" class="wire" marker-end="url(#arrow)"/></g><g><rect x="700" y="405" width="220" height="72" rx="18" fill="#13263b" stroke="#65e3a5" stroke-width="2"/><text x="810" y="450" text-anchor="middle" class="label">Replay</text></g><text x="500" y="545" text-anchor="middle" class="small">Prediction supplies speed; replay preserves correctness.</text></svg>