<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Memory ordering as a scheduling constraint</title><desc id="d">A formula combines operand readiness with a memory-order safe time, while the LSQ detects violations.</desc><style>
  .bg{fill:#07111f}.panel{fill:#0e1b2b;stroke:#29405a;stroke-width:2}
  .title{font:700 30px system-ui,sans-serif;fill:#f5f8fc}.label{font:600 20px system-ui,sans-serif;fill:#f5f8fc}
  .small{font:17px system-ui,sans-serif;fill:#a8b7c8}.tiny{font:14px system-ui,sans-serif;fill:#a8b7c8}
  .cyan{fill:#31d7e8}.amber{fill:#ffb454}.green{fill:#65e3a5}.red{fill:#ff7184}.purple{fill:#a78bfa}
  .wire{fill:none;stroke:#9fb0c4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#9fb0c4"/></marker><marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#31d7e8"/></marker></defs><rect width="1000" height="600" class="bg"/><text x="50" y="58" class="title">Memory ordering becomes another lower bound</text><rect x="110" y="95" width="780" height="115" rx="24" class="panel"/><text x="500" y="142" text-anchor="middle" class="small">earliest memory-operation time</text><text x="500" y="182" text-anchor="middle" class="label">max(operand ready, memory-order safe)</text><rect x="50" y="255" width="420" height="250" rx="26" class="panel"/><text x="80" y="297" class="label amber">Known same address</text><rect x="105" y="330" width="300" height="52" rx="14" fill="#2c2219" stroke="#ffb454" stroke-width="2"/><text x="255" y="363" text-anchor="middle" class="label">STORE [A] = 5</text><path d="M255 390v45" class="wire" marker-end="url(#arrow)"/><rect x="105" y="445" width="300" height="52" rx="14" fill="#102b3b" stroke="#31d7e8" stroke-width="2"/><text x="255" y="478" text-anchor="middle" class="label">LOAD x = [A]</text><rect x="530" y="255" width="420" height="250" rx="26" class="panel"/><text x="560" y="297" class="label cyan">Independent cache lines</text><rect x="585" y="330" width="300" height="52" rx="14" fill="#2c2219" stroke="#ffb454" stroke-width="2"/><text x="735" y="363" text-anchor="middle" class="label">MISS line A</text><rect x="585" y="410" width="300" height="52" rx="14" fill="#102b3b" stroke="#31d7e8" stroke-width="2"/><text x="735" y="443" text-anchor="middle" class="label">MISS line B</text><text x="735" y="490" text-anchor="middle" class="small">different MRQ sets progress OoO</text><text x="500" y="560" text-anchor="middle" class="label">TRM avoids selected hazards; the ordinary LSQ detects mistakes and flushes.</text></svg>