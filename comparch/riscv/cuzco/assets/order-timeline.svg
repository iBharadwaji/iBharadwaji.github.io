<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">In-order scheduling and out-of-order execution</title><desc id="d">Instructions A B C are scheduled in program order but execute B C A according to their future timestamps.</desc><style>
  .bg{fill:#07111f}.panel{fill:#0e1b2b;stroke:#29405a;stroke-width:2}
  .title{font:700 30px system-ui,sans-serif;fill:#f5f8fc}.label{font:600 20px system-ui,sans-serif;fill:#f5f8fc}
  .small{font:17px system-ui,sans-serif;fill:#a8b7c8}.tiny{font:14px system-ui,sans-serif;fill:#a8b7c8}
  .cyan{fill:#31d7e8}.amber{fill:#ffb454}.green{fill:#65e3a5}.red{fill:#ff7184}.purple{fill:#a78bfa}
  .wire{fill:none;stroke:#9fb0c4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#9fb0c4"/></marker><marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#31d7e8"/></marker></defs><rect width="1000" height="560" class="bg"/><text x="50" y="58" class="title">Scheduled in order. Executed out of order.</text><rect x="50" y="95" width="350" height="390" rx="26" class="panel"/><text x="80" y="140" class="label">Program-order scheduling</text><g transform="translate(85 185)"><circle cx="30" cy="30" r="30" fill="#ff7184"/><text x="30" y="37" text-anchor="middle" class="label" fill="#07111f">A</text><text x="80" y="24" class="label">long operation</text><text x="80" y="51" class="tiny">appointment t40</text><path d="M30 64v25" class="wire" marker-end="url(#arrow)"/></g><g transform="translate(85 275)"><circle cx="30" cy="30" r="30" fill="#31d7e8"/><text x="30" y="37" text-anchor="middle" class="label" fill="#07111f">B</text><text x="80" y="24" class="label">independent add</text><text x="80" y="51" class="tiny">appointment t25</text><path d="M30 64v25" class="wire" marker-end="url(#arrow)"/></g><g transform="translate(85 365)"><circle cx="30" cy="30" r="30" fill="#ffb454"/><text x="30" y="37" text-anchor="middle" class="label" fill="#07111f">C</text><text x="80" y="24" class="label">independent store</text><text x="80" y="51" class="tiny">appointment t27</text></g><path d="M430 290H550" class="wire" marker-end="url(#cyanArrow)" stroke="#31d7e8"/><rect x="590" y="95" width="360" height="390" rx="26" fill="#0c2130" stroke="#31d7e8" stroke-width="3"/><text x="620" y="140" class="label cyan">Execution timeline</text><path d="M640 330H900" class="wire" marker-end="url(#arrow)"/><g><circle cx="670" cy="260" r="38" fill="#31d7e8"/><text x="670" y="268" text-anchor="middle" class="label" fill="#07111f">B</text><line x1="670" y1="305" x2="670" y2="350" stroke="#31d7e8" stroke-width="4"/><text x="670" y="390" text-anchor="middle" class="small">t25</text></g><g><circle cx="780" cy="260" r="38" fill="#ffb454"/><text x="780" y="268" text-anchor="middle" class="label" fill="#07111f">C</text><line x1="780" y1="305" x2="780" y2="350" stroke="#ffb454" stroke-width="4"/><text x="780" y="390" text-anchor="middle" class="small">t27</text></g><g><circle cx="885" cy="260" r="38" fill="#ff7184"/><text x="885" y="268" text-anchor="middle" class="label" fill="#07111f">A</text><line x1="885" y1="305" x2="885" y2="350" stroke="#ff7184" stroke-width="4"/><text x="885" y="390" text-anchor="middle" class="small">t40</text></g><text x="770" y="450" text-anchor="middle" class="label">B → C → A</text><text x="500" y="535" text-anchor="middle" class="label">Scheduling order and execution order are different concepts.</text></svg>