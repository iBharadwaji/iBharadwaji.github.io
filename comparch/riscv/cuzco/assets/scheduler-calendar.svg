<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Conventional scheduler versus Cuzco</title><desc id="d">Waiting instructions compete every cycle on the left; instructions reserve future cycles on the right.</desc><style>
  .bg{fill:#07111f}.panel{fill:#0e1b2b;stroke:#29405a;stroke-width:2}
  .title{font:700 30px system-ui,sans-serif;fill:#f5f8fc}.label{font:600 20px system-ui,sans-serif;fill:#f5f8fc}
  .small{font:17px system-ui,sans-serif;fill:#a8b7c8}.tiny{font:14px system-ui,sans-serif;fill:#a8b7c8}
  .cyan{fill:#31d7e8}.amber{fill:#ffb454}.green{fill:#65e3a5}.red{fill:#ff7184}.purple{fill:#a78bfa}
  .wire{fill:none;stroke:#9fb0c4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#9fb0c4"/></marker><marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#31d7e8"/></marker></defs><rect width="1000" height="600" class="bg"/><text x="50" y="58" class="title">Competition now vs. reservations later</text><rect x="50" y="95" width="420" height="440" rx="28" class="panel"/><text x="82" y="140" class="label red">Conventional OoO</text><text x="82" y="169" class="small">Every cycle: wake, compare, prioritize, select</text><circle cx="260" cy="330" r="72" fill="#172235" stroke="#ff7184" stroke-width="4"/><text x="260" y="337" text-anchor="middle" class="label">ALU now</text><g><circle cx="120" cy="235" r="38" fill="#13263b" stroke="#29405a" stroke-width="2"/><text x="120" y="242" text-anchor="middle" class="label">I0</text><path d="M120 235L232 311" class="wire" marker-end="url(#arrow)"/></g><g><circle cx="115" cy="430" r="38" fill="#13263b" stroke="#29405a" stroke-width="2"/><text x="115" y="437" text-anchor="middle" class="label">I1</text><path d="M115 430L231 350" class="wire" marker-end="url(#arrow)"/></g><g><circle cx="400" cy="225" r="38" fill="#13263b" stroke="#29405a" stroke-width="2"/><text x="400" y="232" text-anchor="middle" class="label">I2</text><path d="M400 225L288 309" class="wire" marker-end="url(#arrow)"/></g><g><circle cx="405" cy="430" r="38" fill="#13263b" stroke="#29405a" stroke-width="2"/><text x="405" y="437" text-anchor="middle" class="label">I3</text><path d="M405 430L289 350" class="wire" marker-end="url(#arrow)"/></g><rect x="530" y="95" width="420" height="440" rx="28" fill="#0c2130" stroke="#31d7e8" stroke-width="3"/><text x="562" y="140" class="label cyan">Cuzco</text><text x="562" y="169" class="small">Reserve exact future slots once</text><g transform="translate(560 210)"><text x="28" y="0" text-anchor="middle" class="tiny">t42</text><rect y="18" width="58" height="250" rx="10" fill="#10283b" stroke="#29405a" stroke-width="2"/></g><g transform="translate(632 210)"><text x="28" y="0" text-anchor="middle" class="tiny">t43</text><rect y="18" width="58" height="250" rx="10" fill="#10283b" stroke="#29405a" stroke-width="2"/><rect x="7" y="55" width="44" height="48" rx="7" class="cyan"/><text x="29" y="86" text-anchor="middle" class="tiny" fill="#07111f">I2</text></g><g transform="translate(704 210)"><text x="28" y="0" text-anchor="middle" class="tiny">t44</text><rect y="18" width="58" height="250" rx="10" fill="#10283b" stroke="#29405a" stroke-width="2"/><rect x="7" y="125" width="44" height="48" rx="7" class="amber"/><text x="29" y="156" text-anchor="middle" class="tiny" fill="#07111f">I4</text></g><g transform="translate(776 210)"><text x="28" y="0" text-anchor="middle" class="tiny">t45</text><rect y="18" width="58" height="250" rx="10" fill="#10283b" stroke="#29405a" stroke-width="2"/></g><g transform="translate(848 210)"><text x="28" y="0" text-anchor="middle" class="tiny">t46</text><rect y="18" width="58" height="250" rx="10" fill="#10283b" stroke="#29405a" stroke-width="2"/><rect x="7" y="185" width="44" height="48" rx="7" class="green"/><text x="29" y="216" text-anchor="middle" class="tiny" fill="#07111f">I1</text></g><text x="740" y="505" text-anchor="middle" class="small">Wake at the appointment</text><text x="500" y="575" text-anchor="middle" class="label">Cuzco treats time as an explicit microarchitectural resource.</text></svg>